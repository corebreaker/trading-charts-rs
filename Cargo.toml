[workspace]
resolver = "3"
members = [
    "core",
    "leptos",
    "dioxus",
    "yew",
    "wasmbind-macro",
    "examples/leptos",
    "examples/dioxus",
    "examples/yew",
]

default-members = ["core", "leptos", "dioxus", "yew", "wasmbind-macro"]

[workspace.package]
version = "1.1.0"
edition = "2021"
authors = ["Frédéric Meyer <frederic.meyer.77@gmail.com>"]
description = "Rust bindings of Lightweight Charts with Leptos, Dioxus and Yew adapters"
repository = "https://github.com/corebreaker/trading-charts-rs"
documentation = "https://docs.rs/trading-charts/"
readme = "README.md"
license = "MIT"
keywords = [
    "leptos",
    "dioxus",
    "yew",
    "trading",
    "lightweight-charts",
]

categories = [
    "finance",
    "web-programming",
    "wasm",
]

[workspace.dependencies]
console_error_panic_hook = "0.1"
console_log = "1.1"
dioxus = { version = "0.7", default-features = false }
dioxus-web = { version = "0.7", default-features = false }
emitix = { version = "1.1", features = ["leptos"] }
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "HtmlDivElement", "HtmlElement", "Node", "Window"] }
yew = { version = "0.23", features = ["csr"] }

# Size-optimized release builds, used by the examples.
[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"
